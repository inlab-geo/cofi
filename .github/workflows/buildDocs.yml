name: Build Docs (self-hosted, PR)
on:
  push: 
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
  workflow_dispatch:
jobs:
  build-docs:
    runs-on: self-hosted
    timeout-minutes: 2000
    permissions:
      contents: write   # required to push to PR branch
    env:
      APPTAINER_IMAGE: /home/kitc/inlab-apptainer/inlab.sif
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          submodules: recursive
      - name: Install cofi from checkout into Apptainer env
        run: |
          apptainer exec "$APPTAINER_IMAGE" pip install -e .
      - name: Sanity-check Apptainer image
        run: |
          set -euo pipefail
          echo "Using APPTAINER_IMAGE=$APPTAINER_IMAGE"
          ls -lh "$APPTAINER_IMAGE"
          apptainer inspect "$APPTAINER_IMAGE" | sed -n '1,120p'
          apptainer exec "$APPTAINER_IMAGE" python3.13 -V
          apptainer exec "$APPTAINER_IMAGE" python3.13 -c "import pygimli; print('pygimli', pygimli.__version__)"
          apptainer exec "$APPTAINER_IMAGE" python3.13 -c "import cofi; print('cofi', cofi.__version__)"
      - name: Update cofi-examples submodule to latest main
        run: |
          git submodule update --remote docs/source/cofi-examples
      - name: Build Sphinx docs inside Apptainer
        run: |
          cd docs
          apptainer exec "$APPTAINER_IMAGE" make clean html
      - name: Upload built docs (HyperText Markup Language (HTML)) as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-html-${{ github.sha }}
          path: docs/build/html
          retention-days: 14
      - name: Upload Sphinx build outputs (logs, reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-build-${{ github.sha }}
          path: docs/build
      - name: Detect changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain docs/source/examples/generated docs/source/tutorials/generated)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      - name: Commit regenerated gallery outputs to PR
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config --local user.name "ceres-bot"
          git config --local user.email "ceres-bot@inlab-geo.org"
          git add docs/source/examples/generated docs/source/tutorials/generated
          git commit -m "docs: regenerate gallery outputs (Apptainer)"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
