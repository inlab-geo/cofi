name: Build Docs (self-hosted, PR)
on:
  push: 
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
  workflow_dispatch:
jobs:
  build-docs:
    runs-on: self-hosted
    timeout-minutes: 2000
    permissions:
      contents: write        # push new branch / push to PR branch
      pull-requests: write   # open PR when running on main
    env:
      APPTAINER_IMAGE: /home/kitc/inlab-apptainer/inlab.sif
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          submodules: recursive
      - name: Install cofi from checkout into Apptainer env
        run: |
          apptainer exec "$APPTAINER_IMAGE" pip install -e .
      - name: Sanity-check Apptainer image
        run: |
          set -euo pipefail
          echo "Using APPTAINER_IMAGE=$APPTAINER_IMAGE"
          ls -lh "$APPTAINER_IMAGE"
          apptainer inspect "$APPTAINER_IMAGE" | sed -n '1,120p'
          apptainer exec "$APPTAINER_IMAGE" python3.13 -V
          apptainer exec "$APPTAINER_IMAGE" python3.13 -c "import pygimli; print('pygimli', pygimli.__version__)"
          apptainer exec "$APPTAINER_IMAGE" python3.13 -c "import cofi; print('cofi', cofi.__version__)"
      - name: Update cofi-examples submodule to latest main
        run: |
          git submodule update --remote docs/source/cofi-examples
      - name: Pre-build kriging surrogate model
        run: |
          # Populate scripts_synth_data/ with current notebook content and data files.
          # gen_gallery_scripts.py is idempotent (MD5-cached).
          cd docs/source
          apptainer exec "$APPTAINER_IMAGE" python _ext/gen_gallery_scripts.py
          # Always regenerate the .pkl fresh — smt KRG pickles are version-sensitive
          # and must be created in the same environment that loads them.
          cd examples/scripts_synth_data
          apptainer exec --env MPLBACKEND=Agg "$APPTAINER_IMAGE" \
            python three_survey_lines_surrogate_model_creation.py
      - name: Restore Ceres gallery cache
        run: |
          CACHE=/home/kitc/sphinx_gallery_cache
          if [ -d "$CACHE/examples/generated" ]; then
            rsync -av --update "$CACHE/examples/generated/" \
              docs/source/examples/generated/
          fi
          if [ -d "$CACHE/tutorials/generated" ]; then
            rsync -av --update "$CACHE/tutorials/generated/" \
              docs/source/tutorials/generated/
          fi
      - name: Build Sphinx docs inside Apptainer
        run: |
          cd docs
          apptainer exec "$APPTAINER_IMAGE" make clean html
      - name: Save Ceres gallery cache
        if: always()
        run: |
          CACHE=/home/kitc/sphinx_gallery_cache
          mkdir -p "$CACHE/examples" "$CACHE/tutorials"
          rsync -av docs/source/examples/generated/ \
            "$CACHE/examples/generated/"
          rsync -av docs/source/tutorials/generated/ \
            "$CACHE/tutorials/generated/"
      - name: Upload built docs (HyperText Markup Language (HTML)) as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-html-${{ github.sha }}
          path: docs/build/html
          retention-days: 14
      - name: Upload Sphinx build outputs (logs, reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-build-${{ github.sha }}
          path: docs/build
      - name: Detect changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain docs/source/examples/generated docs/source/tutorials/generated)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
      - name: Commit regenerated gallery outputs to PR
        if: steps.diff.outputs.changed == 'true' && github.head_ref != ''
        run: |
          git config --local user.name "ceres-bot"
          git config --local user.email "ceres-bot@inlab-geo.org"
          git add docs/source/examples/generated docs/source/tutorials/generated
          git commit -m "docs: regenerate gallery outputs (Apptainer)"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
      - name: Open PR with regenerated gallery outputs (main builds)
        if: steps.diff.outputs.changed == 'true' && github.head_ref == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="docs/gallery-update-${GITHUB_SHA::7}"
          git config --local user.name "ceres-bot"
          git config --local user.email "ceres-bot@inlab-geo.org"
          git checkout -b "$BRANCH"
          git add docs/source/examples/generated docs/source/tutorials/generated
          git commit -m "docs: regenerate gallery outputs (Apptainer)"
          git push origin "$BRANCH"
          curl -s -X POST "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d "{
              \"title\": \"docs: regenerate gallery outputs (Apptainer)\",
              \"head\": \"${BRANCH}\",
              \"base\": \"main\",
              \"body\": \"Automatically opened by buildDocs workflow (triggered by ${GITHUB_SHA}).\"
            }"
